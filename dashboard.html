<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard • Agent Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./dashboard.css">
</head>
<body>
  <!-- Ambient background elements -->
  <div class="ambient-glow" aria-hidden="true"></div>
  <div class="ambient-glow right" aria-hidden="true"></div>
  
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="./assets/images/ciphersquad_logo.jpg" alt="Logo" class="sidebar-logo" onerror="this.src='https://ui-avatars.com/api/?name=CS&background=ff7597&color=fff'">
        <span class="logo-text">Agent Harness</span>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="active"><a href="#"><i class="fas fa-home"></i> Overview</a></li>
          <li><a href="#"><i class="fas fa-inbox"></i> Inbox</a></li>
          <li><a href="#"><i class="fas fa-chart-pie"></i> Insights</a></li>
          <li><a href="#"><i class="fas fa-tasks"></i> Tasks</a></li>
          <li><a href="#"><i class="fas fa-robot"></i> Agent</a></li>
        </ul>
        <hr class="nav-divider">
        <ul>
          <li><a href="#"><i class="fas fa-plug"></i> Integrations</a></li>
          <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
      </nav>
      
      <!-- Mini branding at bottom of sidebar -->
      <div class="sidebar-footer">
        <p class="brand-credits">CipherSquad x C2C 7.0</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="search-bar">
          <i class="fas fa-search search-icon"></i>
          <input type="text" placeholder="Search workflows, emails...">
        </div>
        <div class="profile-section">
          <div class="notification-bell">
            <i class="fas fa-bell"></i>
            <span class="badge">3</span>
          </div>
          <span class="profile-name" id="profileName">User</span>
          <img src="https://ui-avatars.com/api/?name=User&background=ff7597&color=fff" alt="User" class="profile-pic" id="profilePic">
        </div>
      </header>

      <!-- Dashboard Content -->
      <div class="dashboard-body">
        <div class="greeting-section animate-fade-in-up" style="animation-delay: 0.1s;">
          <h1 id="greetingTitle">Good morning</h1>
          <p class="subtitle" id="greetingSubtitle">Here's what needs your attention.</p>
        </div>

        <!-- Stats row -->
        <div class="stats-row animate-fade-in-up" style="animation-delay: 0.2s;">
          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-envelope-open-text"></i></div>
            <div class="stat-data">
              <span class="stat-value" id="statEmails">--</span>
              <span class="stat-label">Emails</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon important"><i class="fas fa-exclamation-circle"></i></div>
            <div class="stat-data">
              <span class="stat-value" id="statImportant">--</span>
              <span class="stat-label">Important</span>
            </div>
          </div>
          <div class="stat-card highlight">
            <div class="stat-icon action"><i class="fas fa-bolt"></i></div>
            <div class="stat-data">
              <span class="stat-value" id="statActions">--</span>
              <span class="stat-label">Actions</span>
            </div>
          </div>
        </div>

        <!-- Needs Attention Section -->
        <div class="card needs-attention-card animate-fade-in-up" style="animation-delay: 0.3s;">
          <div class="card-header">
            <h2>🔥 Needs Attention</h2>
          </div>
          <ul class="attention-list" id="attentionList">
            <li class="attention-loading">
              <div class="attention-content">
                <span class="sender">Loading...</span>
              </div>
            </li>
          </ul>
        </div>

        <!-- AI Insight Section -->
        <div class="card ai-insight-card animate-fade-in-up" style="animation-delay: 0.4s;">
          <!-- Glowing border effect -->
          <div class="card-glow-border"></div>
          
          <div class="card-header">
            <h2><i class="fas fa-sparkles"></i> AI INSIGHT</h2>
          </div>
          <div class="card-body">
            <p id="aiInsightText">Analyzing your inbox...</p>
            <div class="insight-actions">
              <button class="btn-primary">
                <i class="fas fa-check-circle"></i> Review them
              </button>
              <button class="btn-secondary">Dismiss</button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Floating action down button -->
      <button class="scroll-down-btn" aria-label="Scroll Down">
        <i class="fas fa-arrow-down"></i>
      </button>
    </main>
  </div>
  <script src="./dashboard.js"></script>
</body>
</html>
